[package]
name = "dez_terminal_host"
version = "0.0.1"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
# The host transport is a partial port from dez v0; the binary is only built
# once that port is finished.
hosted-terminal = ["terminal/hosted-terminal"]

[lib]
name = "dez_terminal_host"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "dez-terminal-host"
path = "src/main.rs"
doctest = false
required-features = ["hosted-terminal"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
clap.workspace = true
net.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
terminal.workspace = true
util.workspace = true
