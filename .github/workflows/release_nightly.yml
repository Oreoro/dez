name: release_nightly
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
on:
  schedule:
    - cron: "0 19 * * *" # daily at 03:00 Asia/Taipei
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  check_nightly_tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - id: check
        name: Check if nightly already built
        run: |
          NIGHTLY_SHA=$(git rev-parse "nightly" 2>/dev/null || echo "")
          if [ "$NIGHTLY_SHA" = "$GITHUB_SHA" ]; then
            echo "Nightly tag already points to current commit. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      skip: ${{ steps.check.outputs.skip }}

  update_nightly_tag:
    needs:
      - check_nightly_tag
    if: needs.check_nightly_tag.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: Update nightly tag
        run: |
          git tag -f nightly HEAD
          git push -f origin nightly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure nightly release exists and is published
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --draft=false
          else
            gh release create nightly --title "Nightly" --notes "Automated nightly builds" --prerelease
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bundle_mac_aarch64:
    needs:
      - update_nightly_tag
    runs-on: macos-15
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Select nightly release channel
        run: printf nightly > crates/dez/RELEASE_CHANNEL
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache
      - run: ./script/bundle-mac aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: dez-aarch64.dmg
          path: target/aarch64-apple-darwin/release/dez-aarch64.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dez-remote-server-macos-aarch64.gz
          path: target/dez-remote-server-macos-aarch64.gz
          if-no-files-found: error
    timeout-minutes: 90

  bundle_mac_x86_64:
    needs:
      - update_nightly_tag
    runs-on: macos-15
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Select nightly release channel
        run: printf nightly > crates/dez/RELEASE_CHANNEL
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache
      - run: ./script/bundle-mac x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: dez-x86_64.dmg
          path: target/x86_64-apple-darwin/release/dez-x86_64.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dez-remote-server-macos-x86_64.gz
          path: target/dez-remote-server-macos-x86_64.gz
          if-no-files-found: error
    timeout-minutes: 90

  bundle_linux_aarch64:
    needs:
      - update_nightly_tag
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Select nightly release channel
        run: printf nightly > crates/dez/RELEASE_CHANNEL
      - run: ./script/linux
      - run: ./script/download-wasi-sdk
      # DEB/RPM releases are disabled because they do not support auto updates.
      # The curl installer uses the tarball produced by ./script/bundle-linux.
      # - name: Install Linux packaging tools
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y cpio desktop-file-utils rpm
      #     ./script/install-nfpm
      # - run: ./script/test-package-linux
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache
      - run: ./script/bundle-linux
      # - run: ./script/package-linux
      - uses: actions/upload-artifact@v4
        with:
          name: dez-linux-aarch64.tar.gz
          path: target/release/dez-linux-aarch64.tar.gz
          if-no-files-found: error
      # DEB/RPM release artifacts are intentionally unpublished until they can
      # participate in dez's auto-update path.
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: dez-linux-aarch64.deb
      #     path: target/release/dez-linux-aarch64.deb
      #     if-no-files-found: error
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: dez-linux-aarch64.rpm
      #     path: target/release/dez-linux-aarch64.rpm
      #     if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dez-remote-server-linux-aarch64.gz
          path: target/dez-remote-server-linux-aarch64.gz
          if-no-files-found: error
    timeout-minutes: 90

  bundle_linux_x86_64:
    needs:
      - update_nightly_tag
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Select nightly release channel
        run: printf nightly > crates/dez/RELEASE_CHANNEL
      - run: ./script/linux
      - run: ./script/download-wasi-sdk
      # DEB/RPM releases are disabled because they do not support auto updates.
      # The curl installer uses the tarball produced by ./script/bundle-linux.
      # - name: Install Linux packaging tools
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y cpio desktop-file-utils rpm
      #     ./script/install-nfpm
      # - run: ./script/test-package-linux
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache
      - run: ./script/bundle-linux
      # - run: ./script/package-linux
      - uses: actions/upload-artifact@v4
        with:
          name: dez-linux-x86_64.tar.gz
          path: target/release/dez-linux-x86_64.tar.gz
          if-no-files-found: error
      # DEB/RPM release artifacts are intentionally unpublished until they can
      # participate in dez's auto-update path.
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: dez-linux-x86_64.deb
      #     path: target/release/dez-linux-x86_64.deb
      #     if-no-files-found: error
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: dez-linux-x86_64.rpm
      #     path: target/release/dez-linux-x86_64.rpm
      #     if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dez-remote-server-linux-x86_64.gz
          path: target/dez-remote-server-linux-x86_64.gz
          if-no-files-found: error
    timeout-minutes: 90

  bundle_windows_x86_64:
    needs:
      - update_nightly_tag
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Select nightly release channel
        shell: pwsh
        run: Set-Content -Path crates/dez/RELEASE_CHANNEL -Value nightly -NoNewline
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache
      - shell: pwsh
        run: script/bundle-windows.ps1 -Architecture x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: dez-x86_64.exe
          path: target/dez-x86_64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dez-remote-server-windows-x86_64.zip
          path: target/dez-remote-server-windows-x86_64.zip
          if-no-files-found: error
    timeout-minutes: 150

  bundle_windows_aarch64:
    needs:
      - update_nightly_tag
    runs-on: windows-11-arm
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Select nightly release channel
        shell: pwsh
        run: Set-Content -Path crates/dez/RELEASE_CHANNEL -Value nightly -NoNewline
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache
      - shell: pwsh
        run: script/bundle-windows.ps1 -Architecture aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: dez-aarch64.exe
          path: target/dez-aarch64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dez-remote-server-windows-aarch64.zip
          path: target/dez-remote-server-windows-aarch64.zip
          if-no-files-found: error
    timeout-minutes: 150

  upload_nightly_assets:
    needs:
      - bundle_mac_aarch64
      - bundle_mac_x86_64
      - bundle_linux_aarch64
      - bundle_linux_x86_64
      - bundle_windows_x86_64
      - bundle_windows_aarch64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts/
      - name: Prepare and upload nightly artifacts
        run: |
          mkdir -p release-artifacts/
          mv ./artifacts/dez-aarch64.dmg/dez-aarch64.dmg release-artifacts/dez-aarch64.dmg
          mv ./artifacts/dez-x86_64.dmg/dez-x86_64.dmg release-artifacts/dez-x86_64.dmg
          mv ./artifacts/dez-linux-aarch64.tar.gz/dez-linux-aarch64.tar.gz release-artifacts/dez-linux-aarch64.tar.gz
          # DEB/RPM artifacts are intentionally not uploaded because they do not
          # support dez's auto-update path.
          # mv ./artifacts/dez-linux-aarch64.deb/dez-linux-aarch64.deb release-artifacts/dez-linux-aarch64.deb
          # mv ./artifacts/dez-linux-aarch64.rpm/dez-linux-aarch64.rpm release-artifacts/dez-linux-aarch64.rpm
          mv ./artifacts/dez-linux-x86_64.tar.gz/dez-linux-x86_64.tar.gz release-artifacts/dez-linux-x86_64.tar.gz
          # mv ./artifacts/dez-linux-x86_64.deb/dez-linux-x86_64.deb release-artifacts/dez-linux-x86_64.deb
          # mv ./artifacts/dez-linux-x86_64.rpm/dez-linux-x86_64.rpm release-artifacts/dez-linux-x86_64.rpm
          mv ./artifacts/dez-x86_64.exe/dez-x86_64.exe release-artifacts/dez-x86_64.exe
          mv ./artifacts/dez-aarch64.exe/dez-aarch64.exe release-artifacts/dez-aarch64.exe
          mv ./artifacts/dez-remote-server-macos-aarch64.gz/dez-remote-server-macos-aarch64.gz release-artifacts/dez-remote-server-macos-aarch64.gz
          mv ./artifacts/dez-remote-server-macos-x86_64.gz/dez-remote-server-macos-x86_64.gz release-artifacts/dez-remote-server-macos-x86_64.gz
          mv ./artifacts/dez-remote-server-linux-aarch64.gz/dez-remote-server-linux-aarch64.gz release-artifacts/dez-remote-server-linux-aarch64.gz
          mv ./artifacts/dez-remote-server-linux-x86_64.gz/dez-remote-server-linux-x86_64.gz release-artifacts/dez-remote-server-linux-x86_64.gz
          mv ./artifacts/dez-remote-server-windows-aarch64.zip/dez-remote-server-windows-aarch64.zip release-artifacts/dez-remote-server-windows-aarch64.zip
          mv ./artifacts/dez-remote-server-windows-x86_64.zip/dez-remote-server-windows-x86_64.zip release-artifacts/dez-remote-server-windows-x86_64.zip

          if gh release view nightly --json assets --jq '.assets[].name' --repo ${{ github.repository }} | grep -Fxq latest-sha; then
            gh release delete-asset nightly latest-sha --yes --repo ${{ github.repository }}
          fi
          gh release upload nightly release-artifacts/* --clobber --repo ${{ github.repository }}
          printf '%s' "$GITHUB_SHA" > release-artifacts/latest-sha
          gh release upload nightly release-artifacts/latest-sha --clobber --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
