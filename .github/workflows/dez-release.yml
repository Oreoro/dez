  assemble_release:
    name: Assemble Dez GitHub Release
    if: github.event_name == 'push' || inputs.release_tag != ''
    needs:
      - build_macos_arm64
      - build_linux_x86_64
      - build_linux_aarch64
      - build_windows_x86_64
      - build_windows_aarch64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DEZ_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ./artifacts/

      - name: Stage Dez-named release assets
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/
          # Every platform job uploads exactly one Dez-named file; normalize
          # them to stable release asset names regardless of release kind.
          find ./artifacts -name '*.dmg' -exec cp {} release-artifacts/Dez-macOS-M2.dmg \;
          find ./artifacts -name 'dez-linux-x86_64.tar.gz' -exec cp {} release-artifacts/dez-linux-x86_64.tar.gz \;
          find ./artifacts -name 'dez-linux-aarch64.tar.gz' -exec cp {} release-artifacts/dez-linux-aarch64.tar.gz \;
          find ./artifacts -name 'Dez-x86_64.exe' -exec cp {} release-artifacts/Dez-x86_64.exe \;
          find ./artifacts -name 'Dez-aarch64.exe' -exec cp {} release-artifacts/Dez-aarch64.exe \;
          (cd release-artifacts && shasum -a 256 * > SHA256SUMS.txt)
          ls -l release-artifacts/

      - name: Create or update the draft Dez release
        run: |
          set -euo pipefail
          notes="Dez ${DEZ_TAG} (${DEZ_RELEASE_KIND}) — build evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh release create "$DEZ_TAG" --repo="$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Dez $DEZ_TAG" --notes "$notes"; then
            echo "Created draft release $DEZ_TAG"
          else
            gh release edit "$DEZ_TAG" --repo="$GITHUB_REPOSITORY" --draft --title "Dez $DEZ_TAG" --notes "$notes"
            echo "Updated draft release $DEZ_TAG"
          fi

      - name: Upload Dez release assets
        run: |
          set -euo pipefail
          gh release upload "$DEZ_TAG" --repo="$GITHUB_REPOSITORY" --clobber release-artifacts/*

      - name: Validate Dez release assets
        run: |
          set -euo pipefail
          staged="$(ls release-artifacts | sort)"
          uploaded="$(gh release view "$DEZ_TAG" --repo="$GITHUB_REPOSITORY" --json assets -q '[.assets[].name]' | jq -r '.[]' | sort)"
          missing="$(comm -23 <(printf '%s\n' "$staged") <(printf '%s\n' "$uploaded"))"
          if [ -n "$missing" ]; then
            echo "::error::Assets missing from release $DEZ_TAG:"
            printf '%s\n' "$missing"
            exit 1
          fi
          echo "All staged Dez assets are present in release $DEZ_TAG."
