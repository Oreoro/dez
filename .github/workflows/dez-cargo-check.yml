name: Cargo Check Dez for macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dez-cargo-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C symbol-mangling-version=v0 --cfg tokio_unstable -C target-cpu=apple-m2"

jobs:
  cargo_check_macos_arm64:
    name: macOS Apple M2 cargo check
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out Dez
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          toolchain=$(
            sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml
          )
          test -n "$toolchain"
          rustup set profile minimal
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup override set "$toolchain"
          rustc --version --verbose
          cargo --version

      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: dez-cargo-macos-arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            dez-cargo-macos-arm64-

      - name: Restore Rust check intermediates
        id: rust-check-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            target/aarch64-apple-darwin/debug/.fingerprint
            target/aarch64-apple-darwin/debug/build
            target/aarch64-apple-darwin/debug/deps
          key: dez-rust-check-macos-arm64-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dez-rust-check-macos-arm64-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-
            dez-rust-check-macos-arm64-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            dez-rust-check-macos-arm64-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Run cargo check
        id: cargo-check
        run: |
          set -euo pipefail
          cargo check \
            --workspace \
            --all-targets \
            --locked \
            --target aarch64-apple-darwin

      - name: Save Rust check intermediates
        if: ${{ !cancelled() && (steps.cargo-check.outcome == 'success' || steps.cargo-check.outcome == 'failure') && steps.rust-check-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            target/aarch64-apple-darwin/debug/.fingerprint
            target/aarch64-apple-darwin/debug/build
            target/aarch64-apple-darwin/debug/deps
          key: dez-rust-check-macos-arm64-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
