name: Dez nightly build

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Check if rebuild is needed
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check out Dez
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false
          fetch-tags: true
      - id: check
        name: Check nightly tag
        run: |
          set -euo pipefail
          NIGHTLY_SHA=$(git rev-parse "nightly" 2>/dev/null || echo "")
          if [ "$NIGHTLY_SHA" = "$GITHUB_SHA" ]; then
            echo "Nightly tag already points to current commit. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build_macos:
    name: macOS Apple Silicon build
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: macos-15
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_PACKAGE_ZED_CODEGEN_UNITS: "1"
      RUSTFLAGS: "-C symbol-mangling-version=v0 --cfg tokio_unstable -C target-cpu=apple-m2"
    steps:
      - name: Check out Dez
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false

      - name: Set release channel
        run: |
          set -euo pipefail
          version=$(git rev-parse --short HEAD)
          echo "Publishing version: ${version} on release channel nightly"
          echo "nightly" > crates/zed/RELEASE_CHANNEL

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup set profile minimal
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup override set "$toolchain"
          rustc --version --verbose
          cargo --version

      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin/cargo-bundle
            ~/.cargo/git
            ~/.cargo/registry
          key: dez-cargo-macos-arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: dez-cargo-macos-arm64-

      - name: Build the Dez macOS bundle
        run: |
          set -euo pipefail
          ./script/bundle-mac aarch64-apple-darwin

      - name: Upload the Dez macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Dez-nightly-macOS-M2-${{ github.sha }}
          path: target/aarch64-apple-darwin/release/Dez-aarch64.dmg
          if-no-files-found: error
          retention-days: 14

  build_windows_x86_64:
    name: Windows x86_64 build
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-2022
    env:
      CARGO_HOME: C:\cargo
    steps:
      - name: Check out Dez
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false

      - name: Set release channel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = git rev-parse --short HEAD
          Write-Host "Publishing version: $version on release channel nightly"
          "nightly" | Set-Content -Path "crates/zed/RELEASE_CHANNEL"

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          git config --system core.longpaths true
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup set profile minimal
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup override set "$toolchain"
          rustc --version --verbose
          cargo --version

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 6 is required at $iscc"
          }

      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin/cargo-bundle
            ~/.cargo/git
            ~/.cargo/registry
          key: dez-cargo-windows-x86_64-${{ hashFiles('Cargo.lock') }}
          restore-keys: dez-cargo-windows-x86_64-

      - name: Build the Dez Windows bundle
        shell: pwsh
        run: |
          script/bundle-windows.ps1 -Architecture x86_64

      - name: Upload the Dez Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Dez-nightly-windows-x86_64-${{ github.sha }}
          path: target/Zed-x86_64.exe
          if-no-files-found: error
          retention-days: 14

  build_windows_aarch64:
    name: Windows aarch64 build
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-11-arm
    env:
      CARGO_HOME: C:\cargo
    steps:
      - name: Check out Dez
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false

      - name: Set release channel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = git rev-parse --short HEAD
          Write-Host "Publishing version: $version on release channel nightly"
          "nightly" | Set-Content -Path "crates/zed/RELEASE_CHANNEL"

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          git config --system core.longpaths true
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup set profile minimal
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup override set "$toolchain"
          rustc --version --verbose
          cargo --version

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 6 is required at $iscc"
          }

      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin/cargo-bundle
            ~/.cargo/git
            ~/.cargo/registry
          key: dez-cargo-windows-aarch64-${{ hashFiles('Cargo.lock') }}
          restore-keys: dez-cargo-windows-aarch64-

      - name: Build the Dez Windows bundle
        shell: pwsh
        run: |
          script/bundle-windows.ps1 -Architecture aarch64

      - name: Upload the Dez Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Dez-nightly-windows-aarch64-${{ github.sha }}
          path: target/Zed-aarch64.exe
          if-no-files-found: error
          retention-days: 14

  update_nightly_tag:
    name: Update nightly tag
    needs:
      - build_macos
      - build_windows_x86_64
      - build_windows_aarch64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out Dez
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false
          fetch-tags: true

      - name: Update the nightly tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/nightly',
                sha: context.sha,
                force: true
            })
